[build]
  publish = "dist"
  command = "npm run build"
  ignore = "node scripts/ignore-build.cjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/pics/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
